# Runs the same checks you run locally: the test suite on two Python versions,
# then the full demo loop. No secrets, no network - everything runs on the
# bundled fixtures with the mock LLM provider.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check everything compiles
        run: python -m compileall -q core tools

      - name: Run the test suite
        run: python -m pytest -q

      - name: Run the demo loop end to end
        run: |
          cp -n config/hotel.example.yaml config/hotel.yaml || true
          cp -n config/agent.example.yaml config/agent.yaml || true
          python tools/demo.py
